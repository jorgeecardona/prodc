[project]
name = "prodc"
dynamic = ["version"]  # the single source of truth is __version__ in src/prodc/__init__.py (see [tool.hatch.version])
description = "Product management as code: roles, flows, and features traced to evidence."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jorge Cardona", email = "jorgeecardona@gmail.com" }]
keywords = [
    "product-management",
    "requirements",
    "traceability",
    "evidence",
    "yaml",
    "testing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = ["pyyaml>=6"]

[project.scripts]
prodc = "prodc.cli:main"

[project.optional-dependencies]
# mcp: the optional MCP server (`prodc mcp serve`). v2 moved the server import, so pin the major.
mcp = ["mcp>=2,<3"]
# docs are an *extra* (not a uv dependency-group): CI's `pages` job and moon's `docs` task
# install them with `--extra docs` to build the GitLab Pages site
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://gitlab.com/cardona-oss/prodc"
Repository = "https://gitlab.com/cardona-oss/prodc"
Issues = "https://gitlab.com/cardona-oss/prodc/-/issues"
Changelog = "https://gitlab.com/cardona-oss/prodc/-/blob/main/CHANGELOG.md"
Documentation = "https://cardona-oss.gitlab.io/prodc/"

[tool.uv]
# After the pre-commit hook auto-bumps __version__ in the package __init__, uv must treat the
# editable install as stale and reinstall it; without the __init__ key the next `make check`
# runs against the old version. (pyproject is already an implicit key; __init__ is the version source.)
cache-keys = [{ file = "pyproject.toml" }, { file = "src/prodc/__init__.py" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# The version lives as __version__ in the package itself; hatchling reads it (by regex, no import) so
# pyproject and the runtime never disagree. scripts/bump-version rewrites that literal.
path = "src/prodc/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/prodc"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "CHANGELOG.md", "LICENSE"]

[dependency-groups]
# musil is a dev-only model checker (tests/test_models.py); prodc's runtime stays pyyaml-only.
dev = ["ruff>=0.6", "pyright[nodejs]>=1.1.390", "pytest>=8", "types-pyyaml>=6", "musil>=0.35", "mcp>=2,<3"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["prodc"]

[tool.pyright]
include = ["src", "tests", "examples"]
extraPaths = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
