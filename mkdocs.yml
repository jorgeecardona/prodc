site_name: prodc
site_description: Product management as code — roles, flows, and features traced to evidence.
site_url: https://cardona-oss.gitlab.io/prodc/
repo_url: https://gitlab.com/cardona-oss/prodc
repo_name: cardona-oss/prodc

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

# The issue register under docs/issues/ is plain config, not site content.
exclude_docs: |
  issues/

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Commands: commands.md
  - MCP server: mcp.md
  - Model: model.md
  - Config: config.md
  - CI job: ci.md
  - Storybook: storybook.md
  - Lifecycle: lifecycle.md
  - Principles: principles.md
  - UX Laws: ux-laws.md
  - Visual rules: visual.md
  - Grounding (Torres): grounding-torres.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
