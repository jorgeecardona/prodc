site_name: prodc
site_description: Product management as code — roles, flows, and features traced to evidence.
repo_url: https://gitlab.com/jorgeecardona/prodc
repo_name: jorgeecardona/prodc

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

# The issue register under docs/issues/ is plain config, not site content.
exclude_docs: |
  issues/

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Commands: commands.md
  - Model: model.md
  - Config: config.md
  - Lifecycle: lifecycle.md
  - Grounding (Torres): grounding-torres.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
