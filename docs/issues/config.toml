# docs/issues/config.toml — what this folder's issues must say.
#
# Describes the plain-markdown issue register under docs/issues/: the fields each issue
# carries and how the generated index is built. Any tool or pre-commit gate that reads
# this folder should follow this one schema, so the register and its checks agree.

date_style = "DMY"          # 03-08-2026-short-kebab-summary.md
index = false               # no generated README table: `prodc issue board` is the index
index_fields = ["scope", "verify"]

# The one vocabulary that cannot be guessed from outside this repo.
areas = ["model", "loader", "adapters", "status", "cli", "cross-repo", "ci", "docs"]

[fields.scope]
required = true
values = ["XS", "S", "M", "L", "?"]

# How "done" gets checked. The distinction is load-bearing: a green test is not the same claim as a
# sensed fact, and an issue that blurs them sends the next person to the wrong evidence.
[fields.verify]
required = true
values = ["test", "probe", "inspect"]
