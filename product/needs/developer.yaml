who: developer whose agent keeps the product records

needs:

  - id: PD-1
    text: >
      When open decisions exist across a board, the developer can see them all in one list with the
      options ready, and an agent cannot answer them.
    sources:
      - {kind: secondary, date: 2026-11-06, locator: "https://gitlab.com/cardona-oss/prodc/-/work_items/113"}
    must: true
    proofs:
      - "test:tests/test_inbox.py::test_inbox_lists_must_opinions_and_warrant_concerns"
      - "test:tests/test_inbox.py::test_inbox_only_lists_and_never_writes"
    goal: G-1

  - id: PD-2
    text: >
      When an agent has attested many warrants, the developer can review and approve them in bulk,
      with each need and its proof side by side.
    sources:
      - {kind: secondary, date: 2026-11-06, locator: "https://gitlab.com/cardona-oss/prodc/-/work_items/114"}
    goal: G-1

  - id: PD-3
    text: >
      When a board has many old lint warnings, the developer can see only the warnings that are new
      since a saved baseline.
    sources:
      - {kind: secondary, date: 2026-11-06, locator: "https://gitlab.com/cardona-oss/prodc/-/work_items/115"}
    proofs:
      - "test:tests/test_lint_baseline.py::test_baseline_hides_known_warnings_and_shows_new_ones"
    goal: G-2
    release: R-2

  - id: PD-4
    text: >
      When the schema changes, the developer can run one command that rewrites the mechanical changes
      and lists what needs a person.
    sources:
      - {kind: secondary, date: 2026-11-06, locator: "https://gitlab.com/cardona-oss/prodc/-/work_items/116"}
    goal: G-2

  - id: PD-5
    text: >
      When an agent records why a source matters, it can put the reasoning in a field that show prints
      and that is not evidence.
    sources:
      - {kind: secondary, date: 2026-11-06, locator: "https://gitlab.com/cardona-oss/prodc/-/work_items/117"}
    goal: G-1

  - id: PD-6
    text: >
      When the developer sets up CI, they can use an official job with a pinned version that also
      collects test results.
    sources:
      - {kind: secondary, date: 2026-11-06, locator: "https://gitlab.com/cardona-oss/prodc/-/work_items/118"}
    proofs:
      - "test:tests/test_ci_doc.py::test_the_documented_job_pins_an_exact_prodc_version"
      - "test:tests/test_ci_doc.py::test_the_documented_config_reads_the_junit_report"
    goal: G-2

  - id: PD-7
    text: >
      When a source locator points at a missing file or a moved anchor, the developer can see a lint
      warning even without a quote.
    sources:
      - {kind: secondary, date: 2026-11-06, locator: "https://gitlab.com/cardona-oss/prodc/-/work_items/119"}
    goal: G-2
    release: R-2

  - id: PD-8
    text: >
      When the developer reads status --json or portfolio, they can see each need's evidence counts
      per tier.
    sources:
      - {kind: secondary, date: 2026-11-06, locator: "https://gitlab.com/cardona-oss/prodc/-/work_items/120"}
    goal: G-2

  - id: PD-9
    text: >
      When a PM records a gap as a tracker ticket, the developer can import it as a need, with the
      ticket attached as evidence and the need text written as an outcome.
    sources:
      - {kind: secondary, date: 2026-10-04, locator: "https://gitlab.com/cardona-oss/prodc/-/work_items/37"}
      - {kind: secondary, date: 2026-10-05, locator: "https://gitlab.com/cardona-oss/prodc/-/work_items/50"}
    draft: true

  - id: PD-10
    text: >
      When a source points at a GitLab, GitHub or Jira item, the developer can have prodc check it
      live against the tracker API.
    sources:
      - {kind: secondary, date: 2026-10-05, locator: "https://gitlab.com/cardona-oss/prodc/-/work_items/38"}
    draft: true

  - id: PD-11
    text: >
      When the developer ranks needs, they can order them by an opportunity score from importance and
      satisfaction.
    sources:
      - {kind: secondary, date: 2026-10-04, locator: "https://gitlab.com/cardona-oss/prodc/-/work_items/29"}
    draft: true
  - id: PD-12
    text: When a source has a date but no observed_at, the developer can still see how
      old the need's evidence is, instead of an unknown age.
    sources:
    - kind: secondary
      who: prodc docs/issues
      date: '2026-10-05'
      quote: 'Evidence staleness: git fallback + brief section'
      locator: docs/issues/05-10-2026-evidence-staleness-git-fallback.md
      observed_at: '2026-11-12'
    draft: false
    draft_added: '2026-11-12'
    goal: G-2
    release: R-2
  - id: PD-15
    text: When a need is proved by a Storybook story, the developer can see it DELIVERED
      only when the story's test passed, not when the story merely exists.
    sources:
    - kind: secondary
      who: prodc docs/issues
      date: '2026-11-08'
      quote: 'storybook proofs: read story test results, so a story can be really DELIVERED'
      locator: docs/issues/08-11-2026-storybook-test-results.md
      observed_at: '2026-11-12'
    draft: false
    draft_added: '2026-11-12'
    goal: G-2
    release: R-2
  - id: PD-16
    text: When the developer has an idea for the product and does not yet know which need
      it serves, they can record it so it is not lost, and it does not count as a need
      or as a committed decision.
    sources:
    - kind: primary
      who: Jorge
      date: '2026-10-21'
      quote: "an idea that would be cool to explore in the product, but we don't know if it will be useful"
      locator: docs/issues/21-10-2026-draft-decision-idea.md
    - kind: secondary
      who: prodc docs/issues
      date: '2026-10-21'
      quote: 'An idea with no need yet: a draft decision with empty needs[]'
      locator: docs/issues/21-10-2026-draft-decision-idea.md
      observed_at: '2026-11-12'
    draft: false
    draft_added: '2026-11-12'
    goal: G-1
    release: R-1
  - id: PD-17
    text: When a need is about how the product looks (visual order, spacing, consistent
      elements, colour), the developer can see whether a judge other than the coding agent
      approved the look, and the need is not DELIVERED without that verdict.
    sources:
    - kind: primary
      who: Jorge
      date: '2026-10-21'
      quote: "when it comes to visual needs I really need something like the eye of a designer, and I don't really trust in claude skills for that"
      locator: docs/issues/21-10-2026-visual-design-judgement.md
    - kind: secondary
      who: prodc docs/issues
      date: '2026-10-21'
      quote: 'Visual needs need a designer''s eye: a judge that is not Claude'
      locator: docs/issues/21-10-2026-visual-design-judgement.md
      observed_at: '2026-11-12'
    draft: false
    draft_added: '2026-11-12'
    must: true
    goal: G-1
    release: R-1
  - id: PD-19
    text: >
      When an agent picks the next piece of work, it can take an issue linked to the most
      important open need of the current release, and skip the run when none is linked.
    sources:
    - kind: secondary
      who: cabildo agent mighty-golem-c399b, relaying Jorge
      date: '2026-11-12'
      quote: "prodc should hold goals, meaning which needs matter now. Cabildo's autopilot currently takes any ready issue, and the result is busy work with no direction."
      locator: cabildo message 6579
    goal: G-1
    release: R-1
