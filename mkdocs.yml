site_name: prodc
site_description: "A command-line tool for tracking user needs, their evidence and the tests that prove them."
site_url: https://cardona-oss.gitlab.io/prodc/
repo_url: https://gitlab.com/cardona-oss/prodc
repo_name: cardona-oss/prodc

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - content.code.copy

# The issue register under docs/issues/ is plain config, not site content.
exclude_docs: |
  issues/

plugins:
  - search
  - llmstxt:
      markdown_description: "User needs live as YAML in the repo; each need lists who asked for it and the test that proves it, and prodc status computes each need's state from the test suite."
      full_output: llms-full.txt
      sections:
        Usage documentation:
          - index.md
          - quickstart.md
          - commands.md
          - mcp.md
          - model.md
          - config.md
          - ci.md
          - storybook.md
          - lifecycle.md
          - principles.md
          - ux-laws.md
          - visual.md
          - grounding-torres.md

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Commands: commands.md
  - MCP server: mcp.md
  - Model: model.md
  - Config: config.md
  - CI job: ci.md
  - Storybook: storybook.md
  - Lifecycle: lifecycle.md
  - Principles: principles.md
  - UX Laws: ux-laws.md
  - Visual rules: visual.md
  - Grounding (Torres): grounding-torres.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
